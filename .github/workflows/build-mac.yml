# Builds the Mac version (VST3 + AU, universal: Apple Silicon + Intel).
# Run it from the repository's Actions tab ("Run workflow"), or push to main.
# The finished zip appears under the run's "Artifacts" section.
name: Build Mac

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  mac:
    runs-on: macos-15
    env:
      ART: build/VocalChain_artefacts/Release
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel -- -quiet

      - name: Check both architectures and ad-hoc sign
        run: |
          VST3="$ART/VST3/fxnkycat vox.vst3"
          AU="$ART/AU/fxnkycat vox.component"
          for b in "$VST3" "$AU"; do
            lipo -info "$b"/Contents/MacOS/*
            codesign --force --deep --sign - "$b"
          done

      - name: Validate the Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/fxnkycat vox.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx FxVx Fxnk

      - name: Package
        run: |
          mkdir -p "dist/fxnkycat vox"
          cp -R "$ART/VST3/fxnkycat vox.vst3" "dist/fxnkycat vox/"
          cp -R "$ART/AU/fxnkycat vox.component" "dist/fxnkycat vox/"
          cp "installer/mac/HOW TO INSTALL.txt" "dist/fxnkycat vox/"
          cd dist
          # ditto keeps the Mac bundle structure and permissions intact
          ditto -c -k --keepParent "fxnkycat vox" fxnkycat-vox-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fxnkycat-vox-mac
          path: dist/fxnkycat-vox-mac.zip
